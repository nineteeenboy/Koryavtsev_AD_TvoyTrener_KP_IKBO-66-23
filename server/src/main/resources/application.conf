ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.example.trainer.server.ApplicationKt.module ]
    }
}
database {
    url = ${?DATABASE_URL}
    user = ${?DATABASE_USER}
    password = ${?DATABASE_PASSWORD}
}
firebase.serviceAccountPath = ${?FIREBASE_SERVICE_ACCOUNT_PATH}
# Firebase signs ID tokens; JWT_SECRET is intentionally unused.
jwt.secret = ${?JWT_SECRET}

